name: Sync to Local GitLab

on:
  push:
    branches: [ main ] # O la rama que quieras sincronizar

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_HOST: "http://192.168.0.230/quiniela_ivc/quiniela" # Cambia por la URL de tu GitLab
        run: |
          git remote add gitlab https://oauth2:${{ env.GITLAB_TOKEN }}@${{ env.GITLAB_HOST }}
          git push gitlab main --force
