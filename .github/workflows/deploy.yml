name: CI/CD Quiniela Pipeline


on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: 🧹 Linter y Validación de Código
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validar sintaxis de archivos PHP (Linter)
        run: |
          find wordpress/wp-content/plugins/quiniela-worldcup -name "*.php" -exec php -l {} \;

      - name: Verificar estructura del proyecto
        run: |
          echo "✅ Verificando archivos críticos..."
          test -f docker-compose.yml && echo "  ✓ docker-compose.yml existe"
          test -f nginx/default.conf && echo "  ✓ nginx/default.conf existe"
          test -f wordpress/wp-content/plugins/quiniela-worldcup/quiniela-worldcup.php && echo "  ✓ Plugin existe"
          echo "✅ Estructura válida"

  deploy:
    name:  Despliegue Automático al Servidor
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      # ============================================
      # PASO 1: Conectar a Tailscale
      # ============================================
      - name: Conectar a Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # ============================================
      # PASO 2: Configurar clave SSH (ANTES de usar SSH)
      # ============================================
      - name: Configurar clave SSH para el servidor
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # ============================================
      # PASO 3: Agregar host a known_hosts
      # ============================================
      - name: Agregar host a known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ============================================
      # PASO 4: Sincronizar código con rsync
      # ============================================
      - name: Sincronizar código con el Servidor (rsync)
        run: |
          echo " Sincronizando archivos con ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.TARGET_DIR }}/"
          rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.TARGET_DIR }}/
          echo "✅ Sincronización completada"

      # ============================================
      # PASO 5: Ejecutar comandos en el servidor
      # ============================================
      - name: Ejecutar comandos de actualización en el Servidor
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "🚀 Iniciando despliegue..."
            cd ${{ secrets.TARGET_DIR }}
            echo "📁 Directorio: $(pwd)"
            echo "🐳 Deteniendo contenedores..."
            docker-compose down || true
            echo "🐳 Iniciando contenedores..."
            docker-compose up -d --build
            echo "✅ Despliegue completado"
            docker-compose ps