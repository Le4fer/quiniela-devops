version: '3.8'

services:
  # ============================================
  # BASE DE DATOS: MariaDB
  # ============================================
  db:
    image: mariadb:10.11
    container_name: quiniela_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: quiniela_db
      MYSQL_USER: quiniela_user
      MYSQL_PASSWORD: quiniela_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - quiniela-network

  # ============================================
  # WORDPRESS (PHP-FPM)
  # ============================================
  wordpress:
    image: wordpress:6.4-php8.2-fpm-alpine
    container_name: quiniela_wp
    restart: always
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: quiniela_db
      WORDPRESS_DB_USER: quiniela_user
      WORDPRESS_DB_PASSWORD: quiniela_password
    volumes:
      - ./wordpress:/var/www/html
    networks:
      - quiniela-network

  # ============================================
  # PROXY INVERSO: Nginx
  # ============================================
  webserver:
    image: nginx:alpine
    container_name: quiniela_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./wordpress:/var/www/html
    depends_on:
      - wordpress
    networks:
      - quiniela-network

# ============================================
# VOLÚMENES PERSISTENTES
# ============================================
volumes:
  db_data:

# ============================================
# RED PRIVADA
# ============================================
networks:
  quiniela-network:
    driver: bridge