services:
  # ============================================
  # 1. BASE DE DATOS: MariaDB
  # ============================================
  db:
    image: mariadb:10.11
    container_name: quiniela_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: quiniela_db
      MYSQL_USER: quiniela_user
      MYSQL_PASSWORD: quiniela_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - quiniela-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secure_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================
  # 2. WORDPRESS (PHP-FPM)
  # ============================================
  wordpress:
    image: wordpress:6.4-php8.2-fpm-alpine
    container_name: quiniela_wp
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: quiniela_db
      WORDPRESS_DB_USER: quiniela_user
      WORDPRESS_DB_PASSWORD: quiniela_password
    volumes:
      - ./wordpress:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads
    networks:
      - quiniela-network

  # ============================================
  # 3. PROXY INVERSO: Nginx
  # ============================================
  webserver:
    image: nginx:alpine
    container_name: quiniela_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./wordpress:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads
    depends_on:
      - wordpress
    networks:
      - quiniela-network

  # ============================================
  # 4. PROMETHEUS: Recolección de métricas
  # ============================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: quiniela_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - quiniela-network

  # ============================================
  # 5. GRAFANA: Visualización de métricas
  # ============================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: quiniela_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - quiniela-network

  # ============================================
  # 6. CADVISOR: Métricas de contenedores
  # ============================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: quiniela_cadvisor
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - quiniela-network

  # ============================================
  # 7. NODE EXPORTER: Métricas del servidor
  # ============================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: quiniela_node_exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - quiniela-network

  # ============================================
  # 8. BACKUP AUTOMÁTICO
  # ============================================
  backup:
    image: alpine:latest
    container_name: quiniela_backup
    restart: always
    depends_on:
      - db
    volumes:
      - db_backups:/backups
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache docker-cli mysql-client
        chmod +x /backup-db.sh
        echo "0 2 * * * /backup-db.sh >> /var/log/backup.log 2>&1" | crontab -
        crond -f -l 8
    networks:
      - quiniela-network

# ============================================
# VOLÚMENES PERSISTENTES
# ============================================
volumes:
  db_data:
  wp_uploads:
  db_backups:
  prometheus_data:
  grafana_data:

# ============================================
# RED PRIVADA
# ============================================
networks:
  quiniela-network:
    driver: bridge
